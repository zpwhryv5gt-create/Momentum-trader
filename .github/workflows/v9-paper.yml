name: V9 monthly trend paper test
on:
  schedule:
    - cron: '43 17,18 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v9_core.py'
      - 'v9_paper.py'
      - 'test_v9_paper.py'
      - 'v9_dividend_payments.json'
      - 'requirements-v9.txt'
      - '.github/workflows/v9-paper.yml'
permissions:
  contents: write
concurrency:
  group: v9-paper-ledger
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v9.txt
      - name: Install frozen V9 dependencies
        run: pip install -r requirements-v9.txt
      - name: Verify accounting, timing and monthly rules
        run: python -m unittest -v test_v9_paper.py
      - name: Run forward paper ledger
        run: python v9_paper.py
      - name: Save successful ledger atomically
        if: success()
        run: |
          git config user.name "V9 Paper Bot"
          git config user.email "v9-paper-bot@users.noreply.github.com"
          git add paper_v9/
          if ! git diff --cached --quiet; then
            git commit -m "Record V9 forward paper run"
            # Rebase only independent concurrent changes, e.g. V8's ledger.
            # Conflicts fail; never overwrite either strategy's state.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - name: Publish run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-paper-evidence-${{ github.run_id }}
          path: paper_v9/
          retention-days: 90
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          if [ -f paper_v9/REPORT.md ]; then cat paper_v9/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f paper_v9/health.json ]; then cat paper_v9/health.json >> "$GITHUB_STEP_SUMMARY"; fi
