name: V8 audited paper test
on:
  schedule:
    - cron: '17 8-18 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v8_core.py'
      - 'v8_paper.py'
      - 'test_v8_paper.py'
      - 'requirements-paper.txt'
      - '.github/workflows/v8-paper.yml'
permissions:
  contents: write
concurrency:
  group: v8-paper-ledger
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - name: Install
        run: pip install -r requirements-paper.txt
      - name: Verify accounting and execution timing
        run: python -m unittest -v test_v8_paper.py
      - name: Run forward paper ledger
        id: runner
        run: python v8_paper.py
      - name: Save successful ledger atomically
        if: success()
        run: |
          git config user.name "V8 Paper Bot"
          git config user.email "v8-paper-bot@users.noreply.github.com"
          git add paper/
          if ! git diff --cached --quiet; then
            git commit -m "Record audited V8 paper run"
            git push origin HEAD:main
          fi
      - name: Publish run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-paper-evidence-${{ github.run_id }}
          path: paper/
          retention-days: 90
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          if [ -f paper/REPORT.md ]; then cat paper/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f paper/health.json ]; then cat paper/health.json >> "$GITHUB_STEP_SUMMARY"; fi
